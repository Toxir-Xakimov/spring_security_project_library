<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account · SpringLibr</title>

    <style>
        :root {
            --green: #176b50;
            --green-dark: #10523d;
            --ink: #19231f;
            --muted: #68756f;
            --line: #e2e9e4;
            --background: #f5f8f5;
            --white: #fff;
            --error-bg: #fff0ef;
            --error-text: #a33129;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            background: var(--background );
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system,
            BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        a { color: var(--green); text-decoration: none; }
        a:hover { color: var(--green-dark); }

        .topbar {
            height: 72px;
            padding: 0 7vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--white);
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--green-dark);
            font-size: 20px;
            font-weight: 750;
            letter-spacing: -0.6px;
        }

        .brand-mark {
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            background: #e9f4ee;
        }

        .brand-mark svg { width: 22px; height: 22px; }

        .top-link {
            font-size: 14px;
            font-weight: 650;
        }

        main {
            width: min(440px, calc(100% - 36px));
            margin: auto;
            padding: 48px 0;
        }

        .card {
            padding: 38px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--white);
            box-shadow: 0 16px 45px rgba(25, 45, 35, 0.06);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--green);
            font-size: 12px;
            font-weight: 750;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: 30px;
            letter-spacing: -1.1px;
        }

        .subtitle {
            margin: 10px 0 26px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .error {
            margin: 0 0 18px;
            padding: 12px 14px;
            border-radius: 9px;
            background: var(--error-bg);
            color: var(--error-text);
            font-size: 14px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 17px;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 7px;
            font-size: 13px;
            font-weight: 650;
        }

        input {
            width: 100%;
            height: 46px;
            padding: 0 13px;
            border: 1px solid var(--line);
            border-radius: 9px;
            outline: none;
            background: var(--white);
            color: var(--ink);
            font: inherit;
        }

        input:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(23, 107, 80, 0.12);
        }

        .hint {
            color: var(--muted);
            font-size: 12px;
            font-weight: 400;
        }

        button {
            height: 47px;
            margin-top: 3px;
            border: 0;
            border-radius: 9px;
            background: var(--green);
            color: var(--white);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover { background: var(--green-dark); }

        .switch {
            margin: 22px 0 0;
            color: var(--muted);
            text-align: center;
            font-size: 14px;
        }

        footer {
            padding: 20px;
            color: var(--muted);
            text-align: center;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .topbar { padding: 0 18px; }
            .card { padding: 28px 22px; }
        }
    </style>
</head>
<body>
<header class="topbar">
    <a class="brand"  href="/">
        <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21V5.5Z"
                      stroke="currentColor" stroke-width="1.8"
                      stroke-linejoin="round"/>
                <path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"
                      stroke="currentColor" stroke-width="1.8"
                      stroke-linecap="round"/>
            </svg>
        </span>
        <span>SpringLibr</span>
    </a>
    <a class="top-link" href="/auth/login">Log in</a>
</header>

<main>
    <section class="card">
        <p class="eyebrow">Start your collection</p>
        <h1>Create an account</h1>
        <p class="subtitle">Make an account to save and manage your books.</p>

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <form method="post">

            <label>
                Full name
                <input type="text" name="fullname" required maxlength="50"
                       autocomplete="fullname">
            </label>

            <label>
                Username
                <input type="text" name="username" required maxlength="50"
                       autocomplete="username">
            </label>

            <label>
                Password
                <input type="password" name="password" required minlength="8"
                       autocomplete="new-password">
                <span class="hint">Use at least 8 characters.</span>
            </label>

            <label>
                Confirm password
                <input type="password" name="confirmPassword" required
                       minlength="8" autocomplete="new-password">
            </label>

            <button type="submit">Create account</button>
        </form>

        <p class="switch">
            Already have an account?
            <a href="/auth/login">Log in</a>
        </p>
    </section>
</main>

<footer>SpringLibr · Your reading, organized.</footer>
</body>
</html>
